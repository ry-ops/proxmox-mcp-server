version: 2
updates:
  # Python dependencies (uv: updates pyproject.toml and uv.lock together)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # An mcp major changes the server API, so moving to one is a code change, not a version
      # bump (1.x to 2.x was; see #28, which broke startup before the migration).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
