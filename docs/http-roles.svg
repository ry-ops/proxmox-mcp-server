    @keyframes a6 { 0%,23.75% { opacity: 0; transform: translateY(6px); } 25.94%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a6 { animation: a6 16s infinite; }
    @keyframes a7 { 0%,26.25% { transform: translate(0,0); opacity: 0; } 26.88% { opacity: 1; } 31.25% { transform: translate(100px,0px); opacity: 1; } 33.12%,100% { transform: translate(100px,0px); opacity: 0; } } .a7 { animation: a7 16s infinite; }
    @keyframes a8 { 0%,31.88% { transform: translate(0,0); opacity: 0; } 32.50% { opacity: 1; } 34.38% { transform: translate(64px,0px); opacity: 1; } 36.25%,100% { transform: translate(64px,0px); opacity: 0; } } .a8 { animation: a8 16s infinite; }
