  <rect width="960" height="444" rx="20" fill="#0f1420"/>
  <text x="40" y="52" font-size="28" font-weight="800">One server, many clients</text>
  <text x="40" y="78" font-size="15" class="muted">Serve it over HTTP and give every client its own token and role. Each sees only what its role allows.</text>
  <rect x="400" y="112" width="170" height="226" rx="16" fill="#1d2536" stroke="#ff8a1f" stroke-width="2.5"/>
  <text x="485" y="200" text-anchor="middle" font-size="14" font-weight="800">proxmox-mcp</text>
  <text x="485" y="218" text-anchor="middle" font-size="14" font-weight="800">-server-http</text>
  <text x="485" y="242" text-anchor="middle" font-size="11" class="mono muted">:8811/mcp</text>
  <text x="485" y="262" text-anchor="middle" font-size="10.5" class="muted">bearer tokens · roles</text>
  <rect x="40" y="112" width="250" height="46" rx="10" fill="#161d2b" stroke="#2c3750"/>
  <text x="56" y="132" font-size="14" font-weight="700">ops</text>
  <text x="56" y="149" font-size="11.5" class="muted">Claude Code</text>
  <rect x="196" y="124" width="80" height="22" rx="11" fill="#0f1420" stroke="#ff8a1f"/><text x="236" y="139" text-anchor="middle" font-size="11" font-weight="700" class="mono" style="fill:#ffc48a">admin</text>
  <line x1="292" y1="135" x2="398" y2="135" stroke="#2c3750" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle class="a1" cx="296" cy="135" r="6" fill="#ff8a1f"/>
  <line x1="572" y1="135" x2="640" y2="135" stroke="#2c3750" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle class="a2" cx="574" cy="135" r="6" fill="#ff8a1f"/>
  <g class="a3"><rect x="644" y="112" width="286" height="46" rx="10" fill="#161d2b" stroke="#ff8a1f"/><text x="662" y="141" font-size="18" font-weight="800" style="fill:#ffc48a">341 tools</text><text x="912" y="140" text-anchor="end" font-size="12" class="muted">everything</text></g>
  <rect x="40" y="170" width="250" height="46" rx="10" fill="#161d2b" stroke="#2c3750"/>
  <text x="56" y="190" font-size="14" font-weight="700">ci</text>
  <text x="56" y="207" font-size="11.5" class="muted">pipeline</text>
  <rect x="196" y="182" width="80" height="22" rx="11" fill="#0f1420" stroke="#ffb02e"/><text x="236" y="197" text-anchor="middle" font-size="11" font-weight="700" class="mono" style="fill:#ffd48a">operator</text>
  <line x1="292" y1="193" x2="398" y2="193" stroke="#2c3750" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle class="a4" cx="296" cy="193" r="6" fill="#ffb02e"/>
  <line x1="572" y1="193" x2="640" y2="193" stroke="#2c3750" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle class="a5" cx="574" cy="193" r="6" fill="#ffb02e"/>
  <g class="a6"><rect x="644" y="170" width="286" height="46" rx="10" fill="#161d2b" stroke="#ffb02e"/><text x="662" y="199" font-size="18" font-weight="800" style="fill:#ffd48a">268 tools</text><text x="912" y="198" text-anchor="end" font-size="12" class="muted">no destructive tools</text></g>
  <rect x="40" y="228" width="250" height="46" rx="10" fill="#161d2b" stroke="#2c3750"/>
  <text x="56" y="248" font-size="14" font-weight="700">grafana</text>
  <text x="56" y="265" font-size="11.5" class="muted">dashboard</text>
  <rect x="196" y="240" width="80" height="22" rx="11" fill="#0f1420" stroke="#3ec7ff"/><text x="236" y="255" text-anchor="middle" font-size="11" font-weight="700" class="mono" style="fill:#a8e4ff">read</text>
  <line x1="292" y1="251" x2="398" y2="251" stroke="#2c3750" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle class="a7" cx="296" cy="251" r="6" fill="#3ec7ff"/>
