  <rect x="30" y="352" width="900" height="76" rx="14" fill="#0b0f18" stroke="#2c3750"/>
  <text x="48" y="374" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">AUDIT LOG · WHO DID WHAT</text>
  <g class="a13"><text x="48" y="396" font-size="11.5" class="mono" style="fill:#9ff0c4" xml:space="preserve">{"who":"ci","via":"http","tool":"clone_vm","args":{"vmid":9000,"newid":123},"outcome":"ok","task_ok":true}</text></g>
  <g class="a14"><text x="48" y="416" font-size="11.5" class="mono" style="fill:#ff9aa5" xml:space="preserve">{"who":"grafana","via":"http","tool":"stop_vm","outcome":"refused","error":"…not allowed for grafana (role: read)"}</text></g>
</svg>
