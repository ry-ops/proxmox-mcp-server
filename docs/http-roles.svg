    @keyframes a13 { 0%,56.25% { opacity: 0; transform: translateY(6px); } 58.44%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a13 { animation: a13 16s infinite; }
    @keyframes a14 { 0%,67.50% { opacity: 0; transform: translateY(6px); } 69.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a14 { animation: a14 16s infinite; }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
