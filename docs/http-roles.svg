<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="t d">
  <title id="t">HTTP clients with their own tokens and roles</title>
  <desc id="d">Four clients call proxmox-mcp-server-http. ops with the admin role sees 341 tools, ci with the operator role sees 268, grafana with the read role sees 150, and a client with no token gets 401 Unauthorized. The audit log records ci's clone_vm as ok and grafana's stop_vm as refused for its role.</desc>
  <style>
