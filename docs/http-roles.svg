    @keyframes a10 { 0%,36.88% { transform: translate(0,0); opacity: 0; } 37.50% { opacity: 1; } 41.87% { transform: translate(100px,0px); opacity: 1; } 43.75%,100% { transform: translate(100px,0px); opacity: 0; } } .a10 { animation: a10 16s infinite; }
    @keyframes a11 { 0%,42.50% { transform: translate(0,0); opacity: 0; } 43.12% { opacity: 1; } 45.00% { transform: translate(64px,0px); opacity: 1; } 46.87%,100% { transform: translate(64px,0px); opacity: 0; } } .a11 { animation: a11 16s infinite; }
