    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes a1 { 0%,5.00% { transform: translate(0,0); opacity: 0; } 5.62% { opacity: 1; } 10.00% { transform: translate(100px,0px); opacity: 1; } 11.88%,100% { transform: translate(100px,0px); opacity: 0; } } .a1 { animation: a1 16s infinite; }
