  <rect x="40" y="26" width="168" height="26" rx="13" fill="#2d2410" stroke="#ffb02e"/><circle class="hum" cx="58" cy="39" r="5" fill="#ffb02e"/><text x="70" y="44" font-size="12" font-weight="800" letter-spacing=".08em" style="fill:#ffd88a">IN DEVELOPMENT</text>
  <text x="40" y="88" font-size="28" font-weight="800">Getting ready for Linux 7.3 on Proxmox VE 9</text>
  <text x="40" y="114" font-size="15" class="muted">Proxmox has an opt-in 7.3 kernel. Here is what we're building, testing and watching. Plans may change.</text>
  <rect x="30" y="134" width="300" height="214" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="48" y="160" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">NESTED TEST NODE</text>
