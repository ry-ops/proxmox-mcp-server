<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d">
  <title id="t">In development: getting ready for Linux 7.3 on Proxmox VE 9</title>
  <desc id="d">An in-development banner. A nested test node shows its running kernel as 7.0.14-pve, the default. apt install proxmox-kernel-7.3 runs, the node reboots, and get_node_status reports kernel 7.3.5-1-pve, opt-in. Beside it, three columns fill in. On the table: a kernel and package versions tool, deploy_pve_vm for a nested node, a live run of the deploy tools, and a second cluster for Datacenter Manager. Could change: ZFS disk utilization readings, a build based on kernel.org instead of Ubuntu, missing NIC firmware, and new boot-log messages. Stays the same: the Proxmox VE API, every existing tool, 7.0 as the default, and nothing on production.</desc>
