  <g class="a1"><text x="62" y="208" font-size="13" class="mono" style="fill:#a8e4ff">7.0.14-pve</text><text x="298" y="208" text-anchor="end" font-size="11" class="muted">default</text></g>
  <g class="a2"><text x="62" y="208" font-size="13" class="mono" style="fill:#9ff0c4">7.3.5-1-pve</text><text x="298" y="208" text-anchor="end" font-size="11" style="fill:#9ff0c4">opt-in</text></g>
  <g class="a3"><text x="48" y="240" font-size="11.5" class="mono" style="fill:#ffc48a">apt install proxmox-kernel-7.3</text></g>
  <rect x="48" y="250" width="264" height="10" rx="5" fill="#232c3f"/>
  <rect class="a4" x="48" y="250" width="264" height="10" rx="5" fill="#ff8a1f"/>
  <g class="a5"><text x="48" y="282" font-size="11.5" class="mono" style="fill:#d9c6ff">reboot</text><text x="312" y="282" text-anchor="end" font-size="11" class="muted">into the new kernel</text></g>
  <g class="a6"><rect x="48" y="296" width="264" height="36" rx="10" fill="#0b0f18" stroke="#3ddc84"/><text x="62" y="319" font-size="12" class="mono"><tspan style="fill:#9ff0c4">get_node_status</tspan><tspan class="muted"> kernel 7.3 ✓</tspan></text></g>
  <rect x="346" y="134" width="584" height="214" rx="14" fill="#161d2b" stroke="#2c3750"/>
