<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" width="960" height="532" role="img" aria-labelledby="t d">
  <title id="t">Deploy an OS by asking</title>
  <desc id="d">You ask for a Kali VM and the server runs deploy_kali_vm: it fetches Kali's official cloud image and checks its SHA-256, repacks the sparse 25 GiB disk as a 1.06 GiB qcow2, builds a cloud-init seed ISO, creates and boots VM 120, waits for the guest agent to report 10.0.0.77, and deletes the seed ISO. The result shows the address, the user and a password returned once. Below, Ubuntu, Kali, Windows 11 and Datacenter Manager build side by side, each tool finishing with how to reach the machine.</desc>
