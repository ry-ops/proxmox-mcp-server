    @keyframes a7 { 0%,34.72% { opacity: 0; transform: translateY(6px); } 36.67%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a7 { animation: a7 18s infinite; }
    @keyframes a8 { 0%,42.22% { opacity: 0; transform: translateY(6px); } 44.17%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a8 { animation: a8 18s infinite; }
