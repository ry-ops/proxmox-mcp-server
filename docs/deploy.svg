    @keyframes a10 { 0%,13.33% { opacity: 0; transform: translateY(6px); } 15.28%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a10 { animation: a10 18s infinite; }
    @keyframes a11 { 0%,16.67% { width: 0; } 36.11%,96.67% { width: 230px; } 98.61%,100% { width: 0; } } .a11 { animation: a11 18s infinite; }
    @keyframes a12 { 0%,36.67% { opacity: 0; transform: translateY(6px); } 38.61%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a12 { animation: a12 18s infinite; }
    @keyframes a13 { 0%,15.56% { opacity: 0; transform: translateY(6px); } 17.50%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a13 { animation: a13 18s infinite; }
    @keyframes a14 { 0%,18.89% { width: 0; } 53.33%,96.67% { width: 230px; } 98.61%,100% { width: 0; } } .a14 { animation: a14 18s infinite; }
