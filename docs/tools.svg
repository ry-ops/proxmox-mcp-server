<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">340 tools across 14 areas of the Proxmox VE API</title>
  <desc id="d">A tile map of the server's tools by API area, bigger tiles for more tools: QEMU VMs 46, nodes 38, cluster and HA 37, access control 33, Ceph 33, firewall 31, LXC containers 28, notifications 23, disks 17, ACME and certificates 17, SDN 16, storage and backup 14, pools 5, appliances 2.</desc>
