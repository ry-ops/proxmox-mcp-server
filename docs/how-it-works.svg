    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes gA0 { 0%,3.33% { transform: translateX(0); opacity: 0; } 4.17% { opacity: 1; } 16.67% { transform: translateX(300px); opacity: 1; } 18.33%,100% { transform: translateX(300px); opacity: 0; } } .gA0 { animation: gA0 12.0s infinite; }
    @keyframes pA0 { 0%,6.67% { transform: translateX(0); opacity: 0; } 7.50% { opacity: 1; } 20.00% { transform: translateX(300px); opacity: 1; } 21.67%,100% { transform: translateX(300px); opacity: 0; } } .pA0 { animation: pA0 12.0s infinite; }
    @keyframes dA0 { 0%,10.00% { transform: translateX(0); opacity: 0; } 10.83% { opacity: 1; } 23.33% { transform: translateX(300px); opacity: 1; } 25.00%,100% { transform: translateX(300px); opacity: 0; } } .dA0 { animation: dA0 12.0s infinite; }
    @keyframes gB0 { 0%,53.33% { transform: translateX(0); opacity: 0; } 54.17% { opacity: 1; } 66.67% { transform: translateX(300px); opacity: 1; } 68.33%,100% { transform: translateX(300px); opacity: 0; } } .gB0 { animation: gB0 12.0s infinite; }
    @keyframes pB0 { 0%,56.67% { transform: translateX(0); opacity: 0; } 57.50% { opacity: 1; } 70.00% { transform: translateX(54px); opacity: 1; } 71.67%,100% { transform: translateX(54px); opacity: 0; } } .pB0 { animation: pB0 12.0s infinite; }
    @keyframes dB0 { 0%,60.00% { transform: translateX(0); opacity: 0; } 60.83% { opacity: 1; } 73.33% { transform: translateX(54px); opacity: 1; } 75.00%,100% { transform: translateX(54px); opacity: 0; } } .dB0 { animation: dB0 12.0s infinite; }
    @keyframes gA1 { 0%,21.67% { transform: translateX(0); opacity: 0; } 22.50% { opacity: 1; } 35.00% { transform: translateX(300px); opacity: 1; } 36.67%,100% { transform: translateX(300px); opacity: 0; } } .gA1 { animation: gA1 12.0s infinite; }
    @keyframes pA1 { 0%,25.00% { transform: translateX(0); opacity: 0; } 25.83% { opacity: 1; } 38.33% { transform: translateX(300px); opacity: 1; } 40.00%,100% { transform: translateX(300px); opacity: 0; } } .pA1 { animation: pA1 12.0s infinite; }
    @keyframes dA1 { 0%,28.33% { transform: translateX(0); opacity: 0; } 29.17% { opacity: 1; } 41.67% { transform: translateX(300px); opacity: 1; } 43.33%,100% { transform: translateX(300px); opacity: 0; } } .dA1 { animation: dA1 12.0s infinite; }
    @keyframes gB1 { 0%,71.67% { transform: translateX(0); opacity: 0; } 72.50% { opacity: 1; } 85.00% { transform: translateX(300px); opacity: 1; } 86.67%,100% { transform: translateX(300px); opacity: 0; } } .gB1 { animation: gB1 12.0s infinite; }
    @keyframes pB1 { 0%,75.00% { transform: translateX(0); opacity: 0; } 75.83% { opacity: 1; } 88.33% { transform: translateX(54px); opacity: 1; } 90.00%,100% { transform: translateX(54px); opacity: 0; } } .pB1 { animation: pB1 12.0s infinite; }
    @keyframes dB1 { 0%,78.33% { transform: translateX(0); opacity: 0; } 79.17% { opacity: 1; } 91.67% { transform: translateX(54px); opacity: 1; } 93.33%,100% { transform: translateX(54px); opacity: 0; } } .dB1 { animation: dB1 12.0s infinite; }
    @keyframes offlab { 0%,0.00% { opacity: 0; } 2.08%,47.92% { opacity: 1; } 50.00%,100% { opacity: 0; } } .offlab { animation: offlab 12.0s infinite; }
    @keyframes onlab { 0%,50.00% { opacity: 0; } 52.08%,97.92% { opacity: 1; } 100.00%,100% { opacity: 0; } } .onlab { animation: onlab 12.0s infinite; }
    @keyframes xp0 { 0%,70.00% { opacity: 0; } 72.08%,76.25% { opacity: 1; } 78.33%,100% { opacity: 0; } } .xp0 { animation: xp0 12.0s infinite; }
    @keyframes xd0 { 0%,73.33% { opacity: 0; } 75.42%,79.58% { opacity: 1; } 81.67%,100% { opacity: 0; } } .xd0 { animation: xd0 12.0s infinite; }
    @keyframes xp1 { 0%,88.33% { opacity: 0; } 90.42%,94.58% { opacity: 1; } 96.67%,100% { opacity: 0; } } .xp1 { animation: xp1 12.0s infinite; }
    @keyframes xd1 { 0%,91.67% { opacity: 0; } 93.75%,97.92% { opacity: 1; } 100.00%,100% { opacity: 0; } } .xd1 { animation: xd1 12.0s infinite; }
    @keyframes knob { 0%,48.33% { transform: translateX(0); } 50.83%,98.33% { transform: translateX(26px); } 100% { transform: translateX(0); } } .knob { animation: knob 12.0s infinite; }
    @keyframes track { 0%,48.33% { fill: #3a4459; } 50.83%,98.33% { fill: #3ec7ff; } 100% { fill: #3a4459; } } .track { animation: track 12.0s infinite; }
    @keyframes gate { 0%,48.33% { opacity: .15; } 50.83%,98.33% { opacity: 1; } 100% { opacity: .15; } } .gate { animation: gate 12.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .onlab, [class^="x"] { opacity: 0; } }
