<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">How Proxmox MCP Server works, and read-only mode</title>
  <desc id="d">Any MCP client, such as Claude Desktop or Claude Code, talks to proxmox-mcp-server over stdio. The server calls the Proxmox VE REST API over HTTPS on port 8006 with an API token or a password. With PROXMOX_READ_ONLY set to true, GET requests still reach Proxmox, while POST, PUT and DELETE are refused inside the server before they reach the network.</desc>
