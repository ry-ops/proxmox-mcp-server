  <rect width="960" height="440" rx="20" fill="#0f1420"/>
  <text x="40" y="52" font-size="28" font-weight="800">How it works</text>
  <text x="40" y="78" font-size="15" class="muted">Your MCP client ⇄ stdio ⇄ proxmox-mcp-server ⇄ HTTPS :8006 ⇄ Proxmox VE. One switch makes it look-but-don't-touch.</text>

  <!-- Clients -->
  <text x="40" y="122" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">MCP CLIENTS</text>
  <rect x="40" y="134" width="200" height="40" rx="10" fill="#161d2b" stroke="#2c3750"/><text x="58" y="159" font-size="14" font-weight="600">Claude Desktop</text><rect x="40" y="184" width="200" height="40" rx="10" fill="#161d2b" stroke="#2c3750"/><text x="58" y="209" font-size="14" font-weight="600">Claude Code</text><rect x="40" y="234" width="200" height="40" rx="10" fill="#161d2b" stroke="#2c3750"/><text x="58" y="259" font-size="14" font-weight="600">Any MCP client</text><rect x="40" y="284" width="200" height="40" rx="10" fill="#161d2b" stroke="#2c3750"/><text x="58" y="309" font-size="14" font-weight="600">A2A agents</text>
  <text x="58" y="345" font-size="11" class="muted mono">agent-card.json: 340 tools</text>
  <path d="M244 246 H330" stroke="#ff8a1f" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
  <text x="252" y="236" font-size="11" class="muted mono">stdio</text>

  <!-- Server -->
  <rect x="336" y="134" width="380" height="214" rx="16" fill="#1d2536" stroke="#ff8a1f" stroke-width="2.5"/>
  <line x1="566" y1="150" x2="566" y2="332" stroke="#2c3750" stroke-dasharray="3 5"/>
  <text x="356" y="164" font-size="16" font-weight="800">proxmox-mcp-server</text>
  <text x="356" y="186" font-size="12" class="muted">Python · httpx · MCP SDK</text>
  <text x="356" y="206" font-size="12" class="muted">run with <tspan class="mono">uv</tspan> or the ghcr.io image</text>
  <rect x="356" y="222" width="186" height="24" rx="12" fill="#10283a" stroke="#3ec7ff"/><text x="449" y="238" text-anchor="middle" font-size="11" class="mono" style="fill:#a8e4ff">API token or password</text>
  <text x="356" y="276" font-size="11" class="mono muted">PROXMOX_READ_ONLY</text>
  <g transform="translate(356 286)">
    <rect class="track" width="54" height="28" rx="14" fill="#3a4459"/>
    <g class="knob"><circle cx="14" cy="14" r="11" fill="#e6ebf5"/></g>
  </g>
  <g class="offlab"><text x="420" y="306" font-size="13" font-weight="800" class="muted">false</text></g>
  <g class="onlab"><text x="420" y="306" font-size="13" font-weight="800" style="fill:#3ec7ff">true · 149 tools work</text></g>

  <!-- Gate -->
  <g class="gate"><rect x="690" y="226" width="8" height="90" rx="4" fill="#3ec7ff"/><text x="694" y="334" text-anchor="middle" font-size="10" font-weight="700" style="fill:#3ec7ff">READ-ONLY GATE</text></g>

  <!-- Lanes -->
  <line x1="572" y1="196" x2="900" y2="196" stroke="#232c3f" stroke-width="2"/>
  <line x1="572" y1="246" x2="900" y2="246" stroke="#232c3f" stroke-width="2"/>
  <line x1="572" y1="296" x2="900" y2="296" stroke="#232c3f" stroke-width="2"/>
  <g class="gA0"><rect x="572" y="185" width="60" height="22" rx="11" fill="#3ddc84"/><text x="602" y="200" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">GET</text></g><g class="pA0"><rect x="572" y="235" width="60" height="22" rx="11" fill="#ffb02e"/><text x="602" y="250" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">POST</text></g><g class="dA0"><rect x="572" y="285" width="60" height="22" rx="11" fill="#ff5c6e"/><text x="602" y="300" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">DELETE</text></g><g class="gB0"><rect x="572" y="185" width="60" height="22" rx="11" fill="#3ddc84"/><text x="602" y="200" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">GET</text></g><g class="pB0"><rect x="572" y="235" width="60" height="22" rx="11" fill="#ffb02e"/><text x="602" y="250" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">POST</text></g><g class="dB0"><rect x="572" y="285" width="60" height="22" rx="11" fill="#ff5c6e"/><text x="602" y="300" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">DELETE</text></g><g class="gA1"><rect x="572" y="185" width="60" height="22" rx="11" fill="#3ddc84"/><text x="602" y="200" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">GET</text></g><g class="pA1"><rect x="572" y="235" width="60" height="22" rx="11" fill="#ffb02e"/><text x="602" y="250" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">POST</text></g><g class="dA1"><rect x="572" y="285" width="60" height="22" rx="11" fill="#ff5c6e"/><text x="602" y="300" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">DELETE</text></g><g class="gB1"><rect x="572" y="185" width="60" height="22" rx="11" fill="#3ddc84"/><text x="602" y="200" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">GET</text></g><g class="pB1"><rect x="572" y="235" width="60" height="22" rx="11" fill="#ffb02e"/><text x="602" y="250" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">POST</text></g><g class="dB1"><rect x="572" y="285" width="60" height="22" rx="11" fill="#ff5c6e"/><text x="602" y="300" text-anchor="middle" font-size="11" font-weight="800" style="fill:#0f1420">DELETE</text></g>
  <g class="xp0"><text x="584" y="232" font-size="12" font-weight="800" style="fill:#ff9aa5">✕ refused</text></g><g class="xd0"><text x="584" y="282" font-size="12" font-weight="800" style="fill:#ff9aa5">✕ refused</text></g><g class="xp1"><text x="584" y="232" font-size="12" font-weight="800" style="fill:#ff9aa5">✕ refused</text></g><g class="xd1"><text x="584" y="282" font-size="12" font-weight="800" style="fill:#ff9aa5">✕ refused</text></g>

  <!-- Proxmox -->
  <rect x="880" y="134" width="56" height="214" rx="14" fill="#2d1f10" stroke="#ff8a1f" stroke-width="2"/>
  <text x="908" y="241" text-anchor="middle" font-size="12" font-weight="800" transform="rotate(-90 908 241)" style="fill:#ffc48a">PROXMOX VE · :8006</text>

  <text x="40" y="392" font-size="13">Read-only mode refuses every POST, PUT and DELETE <tspan font-weight="700">inside the server</tspan>, before anything leaves your machine.</text>
  <text x="40" y="414" font-size="13" class="muted">Pair it with a <tspan class="mono">PVEAuditor</tspan> token and Proxmox enforces the same limit on its side.</text>
</svg>
