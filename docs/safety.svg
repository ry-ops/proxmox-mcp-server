  <g class="a12"><rect x="488" y="214" width="200" height="24" rx="7" fill="#1d2536" stroke="#ff8a1f"/><text x="498" y="230" font-size="12" class="mono"><tspan style="fill:#ffc48a">stop_vm</tspan><tspan class="muted"> vmid=120</tspan></text></g>
  <g class="a13"><text x="700" y="230" font-size="12.5" font-weight="800" style="fill:#9ff0c4">✓ stopped</text></g>
  <g class="a14"><rect x="488" y="244" width="200" height="24" rx="7" fill="#1d2536" stroke="#ff8a1f"/><text x="498" y="260" font-size="12" class="mono"><tspan style="fill:#ffc48a">delete_vm</tspan><tspan class="muted"> vmid=100</tspan></text></g>
  <g class="a15"><text x="700" y="260" font-size="12.5" font-weight="800" style="fill:#ff9aa5">✕ refused · 100 is protected</text></g>
  <g class="a16"><rect x="488" y="274" width="200" height="24" rx="7" fill="#1d2536" stroke="#ff8a1f"/><text x="498" y="290" font-size="12" class="mono"><tspan style="fill:#ffc48a">node_stopall</tspan><tspan class="muted"> node=pve1</tspan></text></g>
  <g class="a17"><text x="700" y="290" font-size="12.5" font-weight="800" style="fill:#ff9aa5">✕ refused · list the guests</text></g>
  <rect x="30" y="326" width="900" height="100" rx="14" fill="#0b0f18" stroke="#2c3750"/>
  <text x="48" y="350" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">AUDIT LOG · PROXMOX_AUDIT_LOG=/var/log/proxmox-mcp/audit.jsonl</text>
  <g class="a18"><text x="48" y="372" font-size="11.5" class="mono" style="fill:#9ff0c4" xml:space="preserve">{"who":"ops","tool":"stop_vm","args":{"node":"pve1","vmid":120},"outcome":"ok","upid":"UPID:pve1:…"}</text></g>
  <g class="a19"><text x="48" y="392" font-size="11.5" class="mono" style="fill:#ff9aa5" xml:space="preserve">{"who":"ops","tool":"delete_vm","args":{"node":"pve1","vmid":100},"outcome":"refused","error":"…protected"}</text></g>
  <g class="a20"><text x="48" y="412" font-size="11.5" class="mono" style="fill:#ff9aa5" xml:space="preserve">{"who":"ops","tool":"node_stopall","args":{"node":"pve1"},"outcome":"refused","error":"…include protected guests"}</text></g>
</svg>
