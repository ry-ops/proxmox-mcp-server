    @keyframes a5 { 0%,11.88% { width: 0; } 18.12%,96.25% { width: 204px; } 98.44%,100% { width: 0; } } .a5 { animation: a5 16s infinite; }
    @keyframes a6 { 0%,17.50% { opacity: 0; transform: translateY(6px); } 19.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a6 { animation: a6 16s infinite; }
    @keyframes a7 { 0%,18.12% { opacity: 0; transform: translateY(6px); } 20.31%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a7 { animation: a7 16s infinite; }
    @keyframes a8 { 0%,19.38% { width: 0; } 25.62%,96.25% { width: 114px; } 98.44%,100% { width: 0; } } .a8 { animation: a8 16s infinite; }
    @keyframes a9 { 0%,25.00% { opacity: 0; transform: translateY(6px); } 27.19%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a9 { animation: a9 16s infinite; }
