<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="t d">
  <title id="t">Guardrails: modes, protected guests and the audit log</title>
  <desc id="d">Three bars show how many tools the client sees: 341 by default, 268 with PROXMOX_NO_DESTRUCTIVE, 150 with PROXMOX_READ_ONLY. On a node, guests 100 and 101 are protected. stop_vm on 120 succeeds, delete_vm on 100 is refused, and node_stopall without a guest list is refused. Each call appears in the JSON-lines audit log.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes a1 { 0%,3.12% { opacity: 0; transform: translateY(6px); } 5.31%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a1 { animation: a1 16s infinite; }
    @keyframes a2 { 0%,4.38% { width: 0; } 10.62%,96.25% { width: 260px; } 98.44%,100% { width: 0; } } .a2 { animation: a2 16s infinite; }
    @keyframes a3 { 0%,10.00% { opacity: 0; transform: translateY(6px); } 12.19%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a3 { animation: a3 16s infinite; }
