  <rect width="960" height="444" rx="20" fill="#0f1420"/>
  <text x="40" y="52" font-size="28" font-weight="800">Guardrails in the server</text>
  <text x="40" y="78" font-size="15" class="muted">Choose how much the assistant can touch, fence off the guests that matter, and keep a record.</text>
  <rect x="30" y="98" width="420" height="214" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="48" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">TOOLS THE CLIENT SEES</text>
  <g class="a1"><text x="48" y="146" font-size="12" class="mono" style="fill:#ffc48a">default</text><text x="432" y="146" text-anchor="end" font-size="11" class="muted">every tool</text></g>
  <rect x="48" y="154" width="260" height="16" rx="8" fill="#232c3f"/>
  <rect class="a2" x="48" y="154" width="260" height="16" rx="8" fill="#ff8a1f"/>
  <g class="a3"><text x="318" y="167" font-size="15" font-weight="800" style="fill:#ffc48a">341</text></g>
  <g class="a4"><text x="48" y="200" font-size="12" class="mono" style="fill:#ffd48a">PROXMOX_NO_DESTRUCTIVE=true</text><text x="432" y="200" text-anchor="end" font-size="11" class="muted">no delete, stop, wipe, rollback</text></g>
  <rect x="48" y="208" width="260" height="16" rx="8" fill="#232c3f"/>
  <rect class="a5" x="48" y="208" width="204" height="16" rx="8" fill="#ffb02e"/>
  <g class="a6"><text x="262" y="221" font-size="15" font-weight="800" style="fill:#ffd48a">268</text></g>
  <g class="a7"><text x="48" y="254" font-size="12" class="mono" style="fill:#a8e4ff">PROXMOX_READ_ONLY=true</text><text x="432" y="254" text-anchor="end" font-size="11" class="muted">reads only</text></g>
  <rect x="48" y="262" width="260" height="16" rx="8" fill="#232c3f"/>
  <rect class="a8" x="48" y="262" width="114" height="16" rx="8" fill="#3ec7ff"/>
  <g class="a9"><text x="172" y="275" font-size="15" font-weight="800" style="fill:#a8e4ff">150</text></g>
  <rect x="470" y="98" width="460" height="214" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="488" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">PROTECTED GUESTS</text>
  <text x="912" y="124" text-anchor="end" font-size="11.5" class="mono" style="fill:#9ff0c4">PROXMOX_PROTECTED_VMIDS=100,101</text>
  <rect x="488" y="138" width="78" height="62" rx="10" fill="#1d2536" stroke="#3ddc84" stroke-width="2"/>
  <text x="527" y="162" text-anchor="middle" font-size="14" font-weight="800">100</text>
  <text x="527" y="180" text-anchor="middle" font-size="11" class="muted">router</text>
  <text x="527" y="194" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing=".05em" style="fill:#9ff0c4">PROTECTED</text>
  <rect x="574" y="138" width="78" height="62" rx="10" fill="#1d2536" stroke="#3ddc84" stroke-width="2"/>
  <text x="613" y="162" text-anchor="middle" font-size="14" font-weight="800">101</text>
  <text x="613" y="180" text-anchor="middle" font-size="11" class="muted">dns</text>
  <text x="613" y="194" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing=".05em" style="fill:#9ff0c4">PROTECTED</text>
  <rect x="660" y="138" width="78" height="62" rx="10" fill="#1d2536" stroke="#2c3750" stroke-width="2"/>
  <text x="699" y="162" text-anchor="middle" font-size="14" font-weight="800">120</text>
  <text x="699" y="180" text-anchor="middle" font-size="11" class="muted">web-01</text>
  <rect x="746" y="138" width="78" height="62" rx="10" fill="#1d2536" stroke="#2c3750" stroke-width="2"/>
  <text x="785" y="162" text-anchor="middle" font-size="14" font-weight="800">121</text>
  <text x="785" y="180" text-anchor="middle" font-size="11" class="muted">web-02</text>
  <rect x="832" y="138" width="78" height="62" rx="10" fill="#1d2536" stroke="#2c3750" stroke-width="2"/>
  <text x="871" y="162" text-anchor="middle" font-size="14" font-weight="800">130</text>
  <text x="871" y="180" text-anchor="middle" font-size="11" class="muted">db</text>
