    @keyframes a16 { 0%,62.50% { opacity: 0; transform: translateY(6px); } 64.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a16 { animation: a16 16s infinite; }
    @keyframes a17 { 0%,67.50% { opacity: 0; transform: translateY(6px); } 69.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a17 { animation: a17 16s infinite; }
