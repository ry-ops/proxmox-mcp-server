    @keyframes a13 { 0%,36.25% { opacity: 0; transform: translateY(6px); } 38.44%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a13 { animation: a13 16s infinite; }
