  <g class="a11"><rect x="30" y="446" width="430" height="30" rx="8" fill="#1d2536" stroke="#ff8a1f"/><text x="42" y="466" font-size="12" class="mono"><tspan style="fill:#ffc48a">pdm_pve_stop_guest</tspan><tspan class="muted"> pve-lab:104</tspan></text></g>
