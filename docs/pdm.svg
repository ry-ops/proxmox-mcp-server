    @keyframes a7 { 0%,23.33% { opacity: 0; transform: translateY(6px); } 25.28%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a7 { animation: a7 18s infinite; }
