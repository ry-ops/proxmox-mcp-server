  <circle class="a1" cx="200" cy="208" r="6" fill="#ff8a1f"/>
  <circle class="a2" cx="500" cy="208" r="6" fill="#3ec7ff"/>
  <circle class="a3" cx="500" cy="208" r="6" fill="#b58cff"/>
  <circle class="a4" cx="500" cy="208" r="6" fill="#ffb02e"/>
  <g class="a5"><rect x="30" y="100" width="300" height="30" rx="8" fill="#1d2536" stroke="#ff8a1f"/><text x="42" y="120" font-size="12" class="mono"><tspan style="fill:#ffc48a">pdm_list_resources</tspan><tspan class="muted"> every remote</tspan></text></g>
  <g class="a6"><text x="42" y="300" font-size="13" font-weight="700" style="fill:#9ff0c4">✓ 31 guests · 5 nodes · 2 datastores, one call</text></g>
