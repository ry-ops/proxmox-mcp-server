    @keyframes a1 { 0%,3.33% { transform: translate(0,0); opacity: 0; } 3.89% { opacity: 1; } 8.89% { transform: translate(100px,0px); opacity: 1; } 10.56%,100% { transform: translate(100px,0px); opacity: 0; } } .a1 { animation: a1 18s infinite; }
