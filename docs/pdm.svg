  <rect x="300" y="146" width="200" height="124" rx="14" fill="#161d2b" stroke="#3ddc84" stroke-width="2"/><text x="400" y="182" text-anchor="middle" font-size="15" font-weight="800">Datacenter Manager</text><text x="400" y="202" text-anchor="middle" font-size="12" class="muted">PDM 1.1 · :8443</text><text x="400" y="230" text-anchor="middle" font-size="11" class="mono" style="fill:#9ff0c4">327 endpoints mapped</text><text x="400" y="248" text-anchor="middle" font-size="11" class="mono" style="fill:#9ff0c4">from its own schema</text>
