    @keyframes a10 { 0%,40.00% { opacity: 0; transform: translateY(6px); } 41.94%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a10 { animation: a10 18s infinite; }
    @keyframes a11 { 0%,53.33% { opacity: 0; transform: translateY(6px); } 55.28%,96.67% { opacity: 1; transform: translateY(0); } 98.61%,100% { opacity: 0; transform: translateY(0); } } .a11 { animation: a11 18s infinite; }
