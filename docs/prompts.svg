    @keyframes a7 { 0%,37.50% { opacity: 0; transform: translateY(6px); } 39.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a7 { animation: a7 16s infinite; }
    @keyframes a8 { 0%,42.50% { opacity: 0; transform: translateY(6px); } 44.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a8 { animation: a8 16s infinite; }
