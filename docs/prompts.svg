    @keyframes a12 { 0%,50.00% { opacity: 0; transform: translateY(6px); } 52.19%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a12 { animation: a12 16s infinite; }
