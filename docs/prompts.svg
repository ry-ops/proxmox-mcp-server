    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes a1 { 0%,1.88% { opacity: 0; transform: translateY(0px); } 4.06%,18.12% { opacity: 1; transform: translateY(0); } 20.31%,100% { opacity: 0; transform: translateY(0); } } .a1 { animation: a1 16s infinite; }
    @keyframes a2 { 0%,18.75% { opacity: 0; transform: translateY(0px); } 20.94%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a2 { animation: a2 16s infinite; }
