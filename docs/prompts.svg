  <g class="a8"><rect x="46" y="296" width="300" height="26" rx="8" fill="#1d2536" stroke="#ff8a1f"/><text x="58" y="314" font-size="12.5" class="mono" style="fill:#ffc48a">get_ha_status</text><text x="358" y="314" font-size="11" font-weight="800" style="fill:#9ff0c4">READ-ONLY ✓</text></g>
  <line x1="46" y1="342" x2="454" y2="342" stroke="#2c3750"/>
  <text x="46" y="364" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">RESOURCES · LIVE STATE, NO TOOL CALL</text>
  <g class="a9"><rect x="46" y="376" width="204" height="22" rx="11" fill="#10283a" stroke="#3ec7ff"/><text x="58" y="391" font-size="11" class="mono" style="fill:#a8e4ff">proxmox://cluster/resources</text></g>
  <g class="a10"><rect x="260" y="376" width="146" height="22" rx="11" fill="#10283a" stroke="#3ec7ff"/><text x="272" y="391" font-size="11" class="mono" style="fill:#a8e4ff">proxmox://nodes</text></g>
  <g class="a11"><rect x="46" y="404" width="270" height="22" rx="11" fill="#10283a" stroke="#3ec7ff"/><text x="58" y="419" font-size="11" class="mono" style="fill:#a8e4ff">proxmox://vms/{node}/{vmid}/config</text></g>
  <rect x="490" y="98" width="440" height="330" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="508" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">THE ASSISTANT REPORTS</text>
  <g class="a12"><rect x="508" y="140" width="404" height="72" rx="10" fill="#1d2536"/><rect x="508" y="140" width="5" height="72" rx="2" fill="#ff5c6e"/><text x="526" y="162" font-size="11" font-weight="800" letter-spacing=".08em" style="fill:#ff9aa5">CRITICAL</text><text x="526" y="182" font-size="13">Backup job on pve2 failed: storage 'nas' unreachable</text><text x="526" y="201" font-size="12" class="muted">Fix: check the NFS mount, then rerun the job</text></g>
  <g class="a13"><rect x="508" y="224" width="404" height="72" rx="10" fill="#1d2536"/><rect x="508" y="224" width="5" height="72" rx="2" fill="#ffb02e"/><text x="526" y="246" font-size="11" font-weight="800" letter-spacing=".08em" style="fill:#ffd48a">WARNING</text><text x="526" y="266" font-size="13">local-lvm on pve1 is almost full</text><text x="526" y="285" font-size="12" class="muted">Fix: prune old snapshots or grow the pool</text></g>
  <g class="a14"><rect x="508" y="308" width="404" height="72" rx="10" fill="#1d2536"/><rect x="508" y="308" width="5" height="72" rx="2" fill="#3ddc84"/><text x="526" y="330" font-size="11" font-weight="800" letter-spacing=".08em" style="fill:#9ff0c4">OK</text><text x="526" y="350" font-size="13">Quorum held, all nodes online</text><text x="526" y="369" font-size="12" class="muted">HA resources in their requested state</text></g>
  <g class="a15"><text x="508" y="412" font-size="13" font-weight="700">Verdict: healthy, one backup to fix today.</text></g>
