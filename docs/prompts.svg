  <g class="a5"><rect x="46" y="194" width="300" height="26" rx="8" fill="#1d2536" stroke="#ff8a1f"/><text x="58" y="212" font-size="12.5" class="mono" style="fill:#ffc48a">get_cluster_resources</text><text x="358" y="212" font-size="11" font-weight="800" style="fill:#9ff0c4">READ-ONLY ✓</text></g>
