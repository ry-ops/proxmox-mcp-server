<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="t d">
  <title id="t">Built-in MCP prompts and resources</title>
  <desc id="d">In the client, typing /mcp__proxmox__ lists five prompts. Choosing cluster_health_check runs five read-only tools: get_cluster_status, get_cluster_resources, list_cluster_tasks, get_task_log and get_ha_status. The assistant reports one critical item, one warning and what is OK, with a verdict. Resources such as proxmox://cluster/resources attach live state without a tool call.</desc>
