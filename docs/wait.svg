<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Waiting for long Proxmox tasks</title>
  <desc id="d">clone_vm with wait: true shows a progress bar while the server polls the task, then returns status stopped, exitstatus OK and ok true in one result. A backup with wait: true outlasts the timeout and returns status running with a note; wait_for_task with its UPID then waits until it finishes OK. A failed task adds its last 20 log lines.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes a1 { 0%,2.50% { opacity: 0; transform: translateY(6px); } 4.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a1 { animation: a1 16s infinite; }
    @keyframes a2 { 0%,6.25% { width: 0; } 37.50%,96.25% { width: 590px; } 98.44%,100% { width: 0; } } .a2 { animation: a2 16s infinite; }
    @keyframes a3 { 0%,8.75% { opacity: 0; transform: translateY(6px); } 10.94%,37.50% { opacity: 1; transform: translateY(0); } 39.69%,100% { opacity: 0; transform: translateY(0); } } .a3 { animation: a3 16s infinite; }
    @keyframes a4 { 0%,16.25% { opacity: 0; transform: translateY(6px); } 18.44%,37.50% { opacity: 1; transform: translateY(0); } 39.69%,100% { opacity: 0; transform: translateY(0); } } .a4 { animation: a4 16s infinite; }
    @keyframes a5 { 0%,26.25% { opacity: 0; transform: translateY(6px); } 28.44%,37.50% { opacity: 1; transform: translateY(0); } 39.69%,100% { opacity: 0; transform: translateY(0); } } .a5 { animation: a5 16s infinite; }
    @keyframes a6 { 0%,38.12% { opacity: 0; transform: translateY(6px); } 40.31%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a6 { animation: a6 16s infinite; }
    @keyframes a7 { 0%,40.62% { opacity: 0; transform: translateY(6px); } 42.81%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a7 { animation: a7 16s infinite; }
    @keyframes a8 { 0%,47.50% { opacity: 0; transform: translateY(6px); } 49.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a8 { animation: a8 16s infinite; }
    @keyframes a9 { 0%,51.25% { width: 0; } 72.50%,96.25% { width: 400px; } 98.44%,100% { width: 0; } } .a9 { animation: a9 16s infinite; }
    @keyframes a10 { 0%,82.50% { width: 0; } 91.25%,96.25% { width: 590px; } 98.44%,100% { width: 0; } } .a10 { animation: a10 16s infinite; }
    @keyframes a11 { 0%,73.12% { opacity: 0; transform: translateY(6px); } 75.31%,81.88% { opacity: 1; transform: translateY(0); } 84.06%,100% { opacity: 0; transform: translateY(0); } } .a11 { animation: a11 16s infinite; }
    @keyframes a12 { 0%,78.75% { opacity: 0; transform: translateY(6px); } 80.94%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a12 { animation: a12 16s infinite; }
    @keyframes a13 { 0%,91.88% { opacity: 0; transform: translateY(6px); } 94.06%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a13 { animation: a13 16s infinite; }
    @keyframes a14 { 0%,74.38% { opacity: 0; transform: translateY(6px); } 76.56%,91.25% { opacity: 1; transform: translateY(0); } 93.44%,100% { opacity: 0; transform: translateY(0); } } .a14 { animation: a14 16s infinite; }
    @keyframes a15 { 0%,92.50% { opacity: 0; transform: translateY(6px); } 94.69%,96.25% { opacity: 1; transform: translateY(0); } 98.44%,100% { opacity: 0; transform: translateY(0); } } .a15 { animation: a15 16s infinite; }
    .alt { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="440" rx="20" fill="#0f1420"/>
  <text x="40" y="52" font-size="28" font-weight="800">Wait for the slow stuff</text>
  <text x="40" y="78" font-size="15" class="muted">Add <tspan class="mono" style="fill:#ffc48a">wait: true</tspan>, or hand any task ID to <tspan class="mono" style="fill:#ffc48a">wait_for_task</tspan>. Slow never means failed.</text>
  <rect x="660" y="100" width="270" height="318" rx="14" fill="#161d2b" stroke="#2c3750"/>
  <text x="678" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">WHAT THE ASSISTANT GETS BACK</text>
  <text x="40" y="118" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">CLONE · FINISHES IN TIME</text>
<g class="a1"><rect x="40" y="130" width="590" height="30" rx="9" fill="#1d2536" stroke="#ff8a1f"/><text x="54" y="150" font-size="13" class="mono"><tspan style="fill:#ffc48a">clone_vm</tspan><tspan class="muted"> node=pve2 vmid=9000 newid=123 wait:true</tspan></text></g>
  <rect x="40" y="178" width="590" height="14" rx="7" fill="#232c3f"/>
  <rect class="a2" x="40" y="178" width="590" height="14" rx="7" fill="#3ddc84"/>
  <g class="a3"><text x="60" y="214" font-size="11" class="mono muted">poll · running</text></g>
  <g class="a4"><text x="210" y="214" font-size="11" class="mono muted">poll · running</text></g>
  <g class="a5"><text x="360" y="214" font-size="11" class="mono muted">poll · running</text></g>
  <g class="a6"><text x="40" y="236" font-size="14" font-weight="800" style="fill:#9ff0c4">✓ stopped · exitstatus OK</text><text x="262" y="236" font-size="12" class="muted">one call, no polling by the model</text></g>
<g class="a7"><text x="678" y="150" font-size="12.5" class="mono" style="fill:#8b96ad" xml:space="preserve">{"data":"UPID:pve2:…:qmclone:…",</text><text x="678" y="169" font-size="12.5" class="mono" style="fill:#e6ebf5" xml:space="preserve"> "task":{"status":"stopped",</text><text x="678" y="188" font-size="12.5" class="mono" style="fill:#e6ebf5" xml:space="preserve">         "exitstatus":"OK",</text><text x="678" y="207" font-size="12.5" class="mono" style="fill:#9ff0c4" xml:space="preserve">         "ok":true}}</text></g>
  <text x="40" y="282" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">BACKUP · OUTLASTS THE TIMEOUT</text>
<g class="a8"><rect x="40" y="294" width="590" height="30" rx="9" fill="#1d2536" stroke="#ff8a1f"/><text x="54" y="314" font-size="13" class="mono"><tspan style="fill:#ffc48a">backup_vm</tspan><tspan class="muted"> node=pve1 vmid=120 storage=nas wait:true</tspan></text></g>
  <rect x="40" y="342" width="590" height="14" rx="7" fill="#232c3f"/>
  <rect class="a9" x="40" y="342" width="400" height="14" rx="7" fill="#ffb02e"/>
  <rect class="a10" x="40" y="342" width="590" height="14" rx="7" fill="#3ddc84"/>
  <g class="alt a11"><text x="452" y="354" font-size="12" font-weight="800" style="fill:#ffb02e">timeout · still running</text></g>
<g class="a12"><rect x="40" y="372" width="460" height="30" rx="9" fill="#1d2536" stroke="#ff8a1f"/><text x="54" y="392" font-size="13" class="mono"><tspan style="fill:#ffc48a">wait_for_task</tspan><tspan class="muted"> upid=UPID:pve1:…:vzdump:120:</tspan></text></g>
  <g class="a13"><text x="516" y="392" font-size="14" font-weight="800" style="fill:#9ff0c4">✓ OK</text></g>
<g class="a14 alt"><text x="678" y="268" font-size="12.5" class="mono" style="fill:#ffb02e" xml:space="preserve">{"task":{"status":"running",</text><text x="678" y="287" font-size="12.5" class="mono" style="fill:#8b96ad" xml:space="preserve"> "note":"Still running after</text><text x="678" y="306" font-size="12.5" class="mono" style="fill:#8b96ad" xml:space="preserve">  900s. Call wait_for_task…"}}</text></g>
<g class="a15"><text x="678" y="268" font-size="12.5" class="mono" style="fill:#e6ebf5" xml:space="preserve">{"status":"stopped",</text><text x="678" y="287" font-size="12.5" class="mono" style="fill:#9ff0c4" xml:space="preserve"> "exitstatus":"OK","ok":true}</text></g>
  <text x="678" y="398" font-size="11.5" class="muted">A failed task adds its last 20 log lines.</text>
</svg>
