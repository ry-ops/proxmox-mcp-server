services:
  proxmox-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ry-ops/proxmox-mcp-server:latest
    container_name: proxmox-mcp-server
    restart: unless-stopped
    # All config (Proxmox creds, read-only, auth token) comes from .env — see .env.example.
    env_file:
      - .env
    ports:
      - "${MCP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.cortex.mcp-server=proxmox"
      - "com.cortex.version=2.0.0"
