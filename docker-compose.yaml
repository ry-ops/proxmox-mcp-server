services:
  proxmox-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ry-ops/proxmox-mcp-server:latest
    container_name: proxmox-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROXMOX_HOST=${PROXMOX_HOST:?Set PROXMOX_HOST in .env (the Proxmox host or IP)}
      - PROXMOX_PORT=${PROXMOX_PORT:-8006}
      - PROXMOX_USER=${PROXMOX_USER}
      - PROXMOX_TOKEN_NAME=${PROXMOX_TOKEN_NAME}
      - PROXMOX_TOKEN_VALUE=${PROXMOX_TOKEN_VALUE}
      - PROXMOX_VERIFY_SSL=${PROXMOX_VERIFY_SSL:-false}
      # To verify Proxmox's self-signed certificate, mount the cluster CA and point at it:
      # - PROXMOX_CA_BUNDLE=/certs/pve-root-ca.pem
      - PROXMOX_READ_ONLY=${PROXMOX_READ_ONLY:-false}
      - PROXMOX_TOOLSETS=${PROXMOX_TOOLSETS:-all}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # MCP servers communicate via stdio, not network ports
    # volumes:
    #   - ./pve-root-ca.pem:/certs/pve-root-ca.pem:ro
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.cortex.mcp-server=proxmox"
      - "com.cortex.version=2.10.0"
